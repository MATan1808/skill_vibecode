# ============================================================
# 360 CORP / Payload CMS + Next.js — Local Development (Docker Compose)
# Usage: docker compose up
# Truy cập: http://localhost:3000  |  Admin: http://localhost:3000/admin
# ============================================================

services:
  app:
    image: node:22-alpine
    container_name: payload-app-dev
    ports:
      - '3001:3000'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - sqlite_data:/app/data
    working_dir: /app
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/app.db
      - NODE_OPTIONS=--max-old-space-size=4096 --no-deprecation
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    env_file:
      - .env
    command: sh -c "corepack enable && pnpm config set ignore-scripts false && pnpm install && pnpm dev"
    tty: true
    stdin_open: true

volumes:
  node_modules:
  sqlite_data:
