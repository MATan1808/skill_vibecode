# ============================================================
# 360 CORP / Payload CMS + Next.js — GitLab CI/CD Pipeline
# ============================================================
# Workflow:
#   - Push develop / MR             → lint only (kiểm tra code, không deploy)
#   - Push branch *-dev             → lint + build Docker image → GitLab Registry
#   - Push main (merge từ develop)  → SSH cloudpanel → native deploy + pm2 reload
# ============================================================

stages:
  - lint
  - build-image
  - deploy

variables:
  PNPM_VERSION: '9'
  NODE_VERSION: '20'
  IMAGE_TAG_BRANCH: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  IMAGE_TAG_SHA: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_TAG_LATEST_DEV: $CI_REGISTRY_IMAGE:latest-dev

# ────────────────────────────────────────────────────────────
# Cache pnpm store giữa các job
# ────────────────────────────────────────────────────────────
.pnpm-cache: &pnpm-cache
  key:
    files:
      - pnpm-lock.yaml
      - package.json
  paths:
    - .pnpm-store/
    - node_modules/

# ────────────────────────────────────────────────────────────
# STAGE 1 — LINT (always)
# ────────────────────────────────────────────────────────────
lint:
  stage: lint
  image: node:20-alpine
  cache:
    <<: *pnpm-cache
  before_script:
    - corepack enable
    - corepack prepare pnpm@${PNPM_VERSION} --activate
    - pnpm config set store-dir .pnpm-store
  script:
    - pnpm install --frozen-lockfile=false
  rules:
    - if: $CI_COMMIT_BRANCH =~ /-dev$/
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ────────────────────────────────────────────────────────────
# STAGE 2 — BUILD DOCKER IMAGE (branch *-dev)
# ────────────────────────────────────────────────────────────
build-image:
  stage: build-image
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_BUILDKIT: '1'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - echo "🐳 Building image $IMAGE_TAG_BRANCH"
    - docker build
        --tag "$IMAGE_TAG_BRANCH"
        --tag "$IMAGE_TAG_SHA"
        --tag "$IMAGE_TAG_LATEST_DEV"
        --cache-from "$IMAGE_TAG_LATEST_DEV"
        --build-arg BUILDKIT_INLINE_CACHE=1
        .
    - echo "📦 Pushing all tags to $CI_REGISTRY_IMAGE"
    - docker push "$IMAGE_TAG_BRANCH"
    - docker push "$IMAGE_TAG_SHA"
    - docker push "$IMAGE_TAG_LATEST_DEV"
    - echo "✅ Image pushed successfully."
  rules:
    - if: $CI_COMMIT_BRANCH =~ /-dev$/

# ────────────────────────────────────────────────────────────
# STAGE 3 — DEPLOY PRODUCTION (branch main → CloudPanel native)
# ────────────────────────────────────────────────────────────
deploy-production:
  stage: deploy
  image: alpine:3.20
  environment:
    name: production
    url: https://vuaai.net
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - cp "$KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    - echo "🚀 Deploy main → ${SERVER_USER}@${SERVER_HOST}:${DEPLOY_PATH}"
    - |
      ssh -i ~/.ssh/id_ed25519 "${SERVER_USER}@${SERVER_HOST}" bash -s "$CI_REPOSITORY_URL" <<'ENDSSH'
        set -euo pipefail
        CI_REPOSITORY_URL=$1
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        nvm use 20

        cd "$DEPLOY_PATH"
        echo "📥 git pull origin main"
        git fetch "$CI_REPOSITORY_URL" main
        git reset --hard FETCH_HEAD

        echo "📦 pnpm install"
        pnpm install --frozen-lockfile=false

        echo "🔧 payload generate:importmap"
        pnpm payload generate:importmap

        echo "🏗️  pnpm build"
        pnpm build

        echo "♻️  pm2 reload (zero-downtime)"
        pm2 reload all --update-env || pm2 start ecosystem.config.cjs

        echo "✅ Deploy thành công"
        pm2 status
      ENDSSH
  variables:
    DEPLOY_PATH: '/home/site/htdocs/site.net'
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
